apply plugin: 'com.android.library'
// AGP 9 ships built-in Kotlin support and registers the `kotlin` extension
// itself. Applying the Kotlin plugin on top of it fails configuration with
// "Cannot add extension with name 'kotlin'". Only apply it when nothing has
// registered that extension yet.
if (project.extensions.findByName('kotlin') == null) {
    apply plugin: 'org.jetbrains.kotlin.android'
}

// React Native codegen. Applied to this library project, it registers
// generateCodegenSchemaFromJavaScript + generateCodegenArtifactsFromSchema, hooks them
// to preBuild, and adds build/generated/source/codegen/java to the main source set.
// Configuration is read from this package's package.json `codegenConfig` block
// (name/type/jsSrcsDir/android.javaPackageName), so no `react { }` block is needed here.
//
// Applied unconditionally rather than gated on newArchEnabled, so that
// build/generated/source/codegen/jni/CMakeLists.txt always exists for the
// add_subdirectory() that the app's generated autolinking CMake emits. The cost is one
// codegen invocation on legacy-architecture builds.
apply plugin: 'com.facebook.react'

group = 'com.appstack.reactnative'
version = '1.0.0'

// Mirrors com.facebook.react.utils.ProjectUtils.isNewArchEnabled from the React Native
// Gradle plugin, so this library can never disagree with the app about which
// architecture is active.
def isNewArchitectureEnabled() {
    if (project.hasProperty('newArchEnabled')) {
        return project.property('newArchEnabled').toString().toBoolean()
    }
    if (project.hasProperty('react.newArchEnabled')) {
        return project.property('react.newArchEnabled').toString().toBoolean()
    }
    return false
}

def IS_NEW_ARCHITECTURE_ENABLED = isNewArchitectureEnabled()

android {
    namespace 'com.appstack.reactnative'
    compileSdkVersion 35

    // Architecture-specific React Native adapter classes. All behaviour lives in
    // src/main (AppstackReactNativeModuleImpl); these directories hold only the thin
    // module + package classes that differ between architectures. On the new
    // architecture the module extends the codegen-generated
    // NativeAppstackReactNativeSpec, which does not exist on the legacy one.
    sourceSets {
        main {
            java {
                if (IS_NEW_ARCHITECTURE_ENABLED) {
                    srcDirs += ['src/newarch']
                } else {
                    srcDirs += ['src/oldarch']
                }
            }
        }
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared",
                          "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384"
                // Enable 16KB page size support
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
        }

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }
    
    // Ensure library variants are properly published for Gradle dependency resolution
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
        singleVariant('debug') {
            withSourcesJar()
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }

    packagingOptions {
        jniLibs {
            // Ensure proper alignment for 16KB page size compatibility
            useLegacyPackaging = false
        }
        // Keep first occurrence of duplicate libraries
        pickFirsts += ['**/lib/**/*.so']
    }

}

// The one place the native Android SDK version is declared. To test a release
// candidate, point this at the RC's snapshot coordinate and everything below
// adjusts itself. Stable releases must always ship a plain release version:
// snapshots are mutable and expire.
def appstackAndroidSdkVersion = '1.8.0'
def appstackAndroidSdkIsSnapshot = appstackAndroidSdkVersion.endsWith('-SNAPSHOT')

// Release candidates of the native SDK are published to the Central Portal
// snapshot repository, which mavenCentral() does not serve. Register it only
// while this library is pinned to a snapshot, so a released version adds
// nothing to a host app's build.
//
// It has to be registered on every *root* project, not just here: transitive
// dependencies are resolved with the consuming app's repositories, not this
// library project's. Configuring every root project is what makes Expo and
// bare React Native apps route Appstack snapshots to Sonatype.
if (appstackAndroidSdkIsSnapshot) {
    rootProject.allprojects {
        repositories {
            exclusiveContent {
                forRepository {
                    maven {
                        name = 'appstackSnapshots'
                        url = uri('https://central.sonatype.com/repository/maven-snapshots/')
                        mavenContent { snapshotsOnly() }
                    }
                }
                // Only Appstack snapshots come from here. Every other
                // dependency — and every stable Appstack release — keeps
                // resolving through the app's own repositories.
                filter {
                    includeVersionByRegex(
                        'tech\\.appstack\\.android-sdk',
                        'appstack-android-sdk',
                        '.*-SNAPSHOT'
                    )
                }
            }
        }

        // A snapshot coordinate is mutable: re-pushing an RC replaces the
        // artifact in place. Gradle caches changing modules for 24 hours by
        // default, so a rebuild with a warm dependency cache can silently keep
        // testing the previous artifact — including CI, which restores a
        // persisted Gradle cache. Always re-check while on an RC.
        configurations.configureEach {
            resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
        }
    }
}

dependencies {
    compileOnly 'com.facebook.react:react-native:+'

    implementation "tech.appstack.android-sdk:appstack-android-sdk:$appstackAndroidSdkVersion"

    implementation 'androidx.annotation:annotation:1.7.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Task to realign third-party native libraries for 16KB page size support
tasks.register('realign16KBLibraries') {
    doLast {
        // Find objcopy tool from NDK
        def ndkDir = android.ndkDirectory
        if (ndkDir == null) {
            println "WARNING: NDK directory not found, skipping 16KB realignment"
            return
        }
        
        def objcopyPath = null
        def possiblePaths = [
            "${ndkDir}/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-objcopy",
            "${ndkDir}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy",
            "${ndkDir}/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-objcopy.exe"
        ]
        
        for (path in possiblePaths) {
            if (file(path).exists()) {
                objcopyPath = path
                break
            }
        }
        
        if (objcopyPath == null) {
            println "WARNING: llvm-objcopy not found, skipping 16KB realignment"
            return
        }
        
        println "Realigning native libraries for 16KB page size support..."
        
        // Find all .so files in the build intermediates
        def processedCount = 0
        fileTree(buildDir) {
            include '**/merged_jni_libs/**/*.so'
            include '**/stripped_native_libs/**/*.so'
        }.each { soFile ->
            try {
                println "Processing: ${soFile.name}"
                exec {
                    commandLine objcopyPath, 
                        '--set-section-alignment', '.text=16384',
                        '--set-section-alignment', '.data=16384',
                        '--set-section-alignment', '.rodata=16384',
                        '--set-section-alignment', '.bss=16384',
                        soFile.absolutePath
                    ignoreExitValue = true
                }
                processedCount++
            } catch (Exception e) {
                println "WARNING: Could not process ${soFile.name}: ${e.message}"
            }
        }
        
        println "Realigned ${processedCount} native libraries for 16KB compatibility"
    }
}

// Hook the realignment task after JNI libs are merged
tasks.configureEach { task ->
    if (task.name.contains('mergeJniLibFolders') || task.name.contains('mergeNativeLibs')) {
        task.finalizedBy 'realign16KBLibraries'
    }
}
