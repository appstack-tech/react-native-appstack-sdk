# TEMPORARY — DELETE BEFORE MERGING THIS PR.
#
# Narrowed to the single combination still unproven after the first Expo 51-53 run.
#
# That run covered 12 jobs and passed 9. The three failures were:
#   - iOS 51 (both architectures): React Native 0.74's post_install clamps every pod to
#     IPHONEOS_DEPLOYMENT_TARGET 13.4, below the iOS 15.0 the vendored framework needs,
#     so AppstackBridge.swift cannot compile. A genuine, pre-existing incompatibility;
#     Expo 51 iOS is not supported and there is nothing here to re-test.
#   - Android 51 new: the harness asserted on generateAutolinkingNewArchitectureFiles,
#     a task React Native 0.74 does not have. Fixed; this run verifies that fix.
name: TEMP legacy SDK smoke

on:
  push:
    branches:
      - feat/jsantelys/turbomodule-legacy-compat
  workflow_dispatch:

concurrency:
  group: temp-legacy-sdk-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: TEMP smoke / Android (Expo SDK 51, new)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android runtime check
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.34.0
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: ./integration-tests/run.sh 51 --platform android --architecture new --smoke
