# TEMPORARY — DELETE BEFORE MERGING THIS PR.
#
# One-off runtime validation of the SwiftPM packaging changes across the whole
# Expo compatibility range and both supported React Native architectures. The
# permanent workflow separately exercises React Native 0.87 through SwiftPM;
# these jobs guard the existing CocoaPods/npm integration from regressions.
#
# Coverage: new architecture on Expo SDK 51-57, legacy architecture on 51-54.
# Legacy is absent above 54 because Expo removed it in SDK 55, and
# integration-tests/run.sh refuses that combination outright.
#
# Triggered on push because this workflow is intentionally absent from main.
name: TEMP full smoke matrix

on:
  push:
    branches:
      - feat/jsantelys/add-spm-support-for-087
  workflow_dispatch:

concurrency:
  group: temp-full-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-smoke-matrix:
    name: TEMP smoke / Android (Expo SDK ${{ matrix.expo-sdk }}, ${{ matrix.architecture }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { expo-sdk: '51', architecture: 'new' }
          - { expo-sdk: '52', architecture: 'new' }
          - { expo-sdk: '53', architecture: 'new' }
          - { expo-sdk: '54', architecture: 'new' }
          - { expo-sdk: '55', architecture: 'new' }
          - { expo-sdk: '56', architecture: 'new' }
          - { expo-sdk: '57', architecture: 'new' }
          - { expo-sdk: '51', architecture: 'legacy' }
          - { expo-sdk: '52', architecture: 'legacy' }
          - { expo-sdk: '53', architecture: 'legacy' }
          - { expo-sdk: '54', architecture: 'legacy' }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android runtime check
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.34.0
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: ./integration-tests/run.sh ${{ matrix.expo-sdk }} --platform android --architecture ${{ matrix.architecture }} --smoke

  ios-smoke-matrix:
    name: TEMP smoke / iOS (Expo SDK ${{ matrix.expo-sdk }}, ${{ matrix.architecture }}, Xcode ${{ matrix.xcode }})
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Expo SDK 54 and older need Xcode 26.2 because newer Xcode versions
        # fail inside their vendored fmt pod before reaching this SDK's code.
        include:
          - { expo-sdk: '51', architecture: 'new', xcode: '26.2' }
          - { expo-sdk: '52', architecture: 'new', xcode: '26.2' }
          - { expo-sdk: '53', architecture: 'new', xcode: '26.2' }
          - { expo-sdk: '54', architecture: 'new', xcode: '26.2' }
          - { expo-sdk: '55', architecture: 'new', xcode: 'default' }
          - { expo-sdk: '56', architecture: 'new', xcode: 'default' }
          - { expo-sdk: '57', architecture: 'new', xcode: 'default' }
          - { expo-sdk: '51', architecture: 'legacy', xcode: '26.2' }
          - { expo-sdk: '52', architecture: 'legacy', xcode: '26.2' }
          - { expo-sdk: '53', architecture: 'legacy', xcode: '26.2' }
          - { expo-sdk: '54', architecture: 'legacy', xcode: '26.2' }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Select and verify Xcode 26.2
        if: ${{ matrix.xcode == '26.2' }}
        run: |
          set -euo pipefail
          XCODE_DEVELOPER_DIR=/Applications/Xcode_26.2.app/Contents/Developer
          test -d "$XCODE_DEVELOPER_DIR"
          XCODE_VERSION="$(DEVELOPER_DIR="$XCODE_DEVELOPER_DIR" xcodebuild -version | sed -n '1p')"
          test "$XCODE_VERSION" = "Xcode 26.2"
          echo "DEVELOPER_DIR=$XCODE_DEVELOPER_DIR" >> "$GITHUB_ENV"
          echo "Selected $XCODE_VERSION"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Boot an iOS simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j \
            | python3 -c "import sys,json;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for v in d.values() for x in v if 'iPhone' in x['name']))")
          echo "Booting $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true

      - name: Run iOS runtime check
        run: ./integration-tests/run.sh ${{ matrix.expo-sdk }} --platform ios --architecture ${{ matrix.architecture }} --smoke
