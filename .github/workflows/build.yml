name: Build

on:
  # A stable release is a merge to main whose CHANGELOG.md has a new dated
  # "## [X.Y.Z] - YYYY-MM-DD" section (see .github/scripts/resolve-release-version.sh).
  # Merges that don't add one publish nothing. Day-to-day work lands on develop;
  # the reviewed develop -> main PR is the release approval. The workflow
  # creates the X.Y.Z tag itself, so pushing a tag by hand no longer publishes.
  #
  # Release candidates are triggered manually with workflow_dispatch on develop
  # and never mint a git tag: the npm version and the `rc` dist-tag are the
  # identity.
  #
  # Keep this file named build.yml: npm's trusted publisher is bound to it.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release candidate version to publish, e.g. 3.6.0-rc.1'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

# Single source of truth for tag validation, reused by the publish and release
# jobs so the gate stays identical. Restricted SemVer: MAJOR.MINOR.PATCH with an
# optional, well-formed prerelease (dot-separated [0-9A-Za-z-] identifiers,
# e.g. 2.4.0-rc1).
env:
  SEMVER_REGEX: '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'

jobs:
  # Decides what this run publishes, before any build: the stable version from
  # the changelog on a push to main, or the validated RC input on a dispatch.
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      release: ${{ steps.meta.outputs.release }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Tags are needed to tell a new version from one already released.
        fetch-depth: 0
        persist-credentials: false
    - name: Resolve version and channel
      id: meta
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF_NAME: ${{ github.ref_name }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
          # RCs publish publicly, so they come only from the protected develop branch.
          if [[ "$REF_NAME" != "develop" ]]; then
            echo "::error::Release candidates are published from develop, not '$REF_NAME'."
            exit 1
          fi
          VERSION="$INPUT_VERSION"
          # Canonical RC form is X.Y.Z-rc.N; accept the legacy -rcN too.
          #
          # Match the whole string, not line by line: `grep -q` would accept a
          # newline-bearing input like "3.6.0-rc.1\nother=1" on its first line,
          # and that value is later echoed into $GITHUB_OUTPUT. [.] keeps the dots
          # literal regardless of how the shell processes backslashes in =~.
          if [[ ! "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+-rc[.]?[0-9]+$ ]]; then
            echo "::error::Dispatch version '$VERSION' is not a release candidate (expected e.g. 3.6.0-rc.1)."
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "channel=rc"
            echo "release=true"
          } >> "$GITHUB_OUTPUT"
        else
          .github/scripts/resolve-release-version.sh CHANGELOG.md
          echo "channel=stable" >> "$GITHUB_OUTPUT"
        fi
    # Fail before the release checks, not after them, when the version copies
    # disagree with the changelog.
    - name: Check version copies agree
      if: ${{ github.event_name == 'push' && steps.meta.outputs.release == 'true' }}
      env:
        VERSION: ${{ steps.meta.outputs.version }}
      run: node scripts/set-version.mjs --check "$VERSION"

  # RC releases run the package and latest-SDK runtime checks. Stable releases
  # additionally run the complete compatibility build matrix.
  release-checks:
    name: ${{ github.event_name == 'workflow_dispatch' && 'RC checks' || 'Stable checks' }}
    needs: resolve
    if: ${{ needs.resolve.outputs.release == 'true' }}
    uses: ./.github/workflows/integration-tests.yml
    with:
      run-compatibility-matrix: ${{ github.event_name != 'workflow_dispatch' }}

  # Build and publish. Stable comes from a merge to main, an RC from workflow_dispatch.
  publish:
    runs-on: ubuntu-latest
    needs: [resolve, release-checks]
    # Serialize publishes: the `rc` dist-tag is a single moving pointer, so two
    # candidates publishing at once would race it. Queue rather than cancel.
    concurrency:
      group: publish-npm
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # Node 24 bundles npm 11.x, which trusted publishing (OIDC) requires. Node 22
    # still bundles npm 10.9.x and cannot perform the OIDC exchange at all, so do
    # not lower this pin to match the other workflows.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'
        # No dependency cache on the release job. It saves only a few seconds on a
        # job that runs a handful of times a month, and this is the one job holding
        # npm publish rights. `package-manager-cache: false` also disables the
        # auto-detect fallback, which an explicit `cache` input would otherwise
        # take precedence over (actions/setup-node src/main.ts).
        package-manager-cache: false
    # A stable release ships the reviewed commit as is: every version copy must
    # already agree (release-pr.yml checked it before the merge; this repeats it
    # on the exact commit being published). An RC's version is a dispatch input,
    # so it is stamped here. See scripts/set-version.mjs.
    - name: Check or stamp version
      env:
        VERSION: ${{ needs.resolve.outputs.version }}
        CHANNEL: ${{ needs.resolve.outputs.channel }}
      run: |
        set -euo pipefail
        if [[ "$CHANNEL" == "rc" ]]; then
          node scripts/set-version.mjs "$VERSION" --no-changelog
        else
          node scripts/set-version.mjs --check "$VERSION"
        fi

    - name: Build and test
      run: ./build.sh --ci --clean

    - name: Create npm package
      run: npm pack

    # Authenticates via npm trusted publishing (OIDC), backed by the workflow's
    # `id-token: write` permission and the trusted publisher configured on the
    # package. There is no NPM_TOKEN to rotate, expire, or have revoked. Provenance
    # attestations are generated automatically, so no --provenance flag is needed.
    - name: Publish to npm
      env:
        VERSION: ${{ needs.resolve.outputs.version }}
        CHANNEL: ${{ needs.resolve.outputs.channel }}
      run: |
        set -euo pipefail
        # Trusted publishing needs npm >= 11.5.1. Fail loudly rather than silently
        # falling back to token auth, which no longer has a token to fall back to.
        REQUIRED_NPM="11.5.1"
        ACTUAL_NPM="$(npm --version)"
        if [[ "$(printf '%s\n%s\n' "$REQUIRED_NPM" "$ACTUAL_NPM" | sort -V | head -n1)" != "$REQUIRED_NPM" ]]; then
          echo "::error::npm $ACTUAL_NPM is too old for trusted publishing (need >= $REQUIRED_NPM)"
          exit 1
        fi
        # actions/setup-node writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
        # into its npmrc. With no token in the environment that expands to an empty
        # string, which npm reads as "auth is already configured" — it then skips the
        # OIDC exchange and publishes with empty credentials, failing with E404.
        NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
        if [[ -f "$NPMRC" ]]; then
          sed -i '/_authToken/d' "$NPMRC"
        fi
        # Re-runs after a failed GitHub Release step must not try to publish
        # the same version again; npm rejects that outright.
        if npm view "react-native-appstack-sdk@$VERSION" version >/dev/null 2>&1; then
          echo "::notice::$VERSION is already on npm; skipping publish."
          exit 0
        fi
        if [[ "$CHANNEL" == "rc" ]]; then
          npm publish --access public --tag rc
          echo "✅ Published $VERSION under the 'rc' dist-tag"
        else
          npm publish --access public
          echo "✅ Published $VERSION under the 'latest' dist-tag"
        fi

  # Create the X.Y.Z tag and a GitHub Release so each version's changes are
  # visible on the repo's Releases page. Notes come from the matching CHANGELOG
  # section. Runs only after publish succeeds (needs: publish), and is the only
  # job granted contents: write. Tags created with GITHUB_TOKEN don't trigger
  # workflows, so this can't start another run.
  #
  # Skipped for release candidates (channel == rc): those still publish to npm
  # but do not get a GitHub Release.
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [resolve, publish]
    if: ${{ needs.resolve.outputs.channel == 'stable' }}
    permissions:
      contents: write   # needed to create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Consume the version as an env value, not inline interpolation.
          VERSION: ${{ needs.resolve.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Defense in depth: publish already validated this with the same
          # SEMVER_REGEX; re-check before it flows into git/gh commands.
          if ! printf '%s' "$VERSION" | grep -Eq "$SEMVER_REGEX"; then
            echo "::error::Refusing to release invalid version '$VERSION'"
            exit 1
          fi

          # Idempotent: skip if a release for this version already exists (e.g. a
          # workflow re-run) instead of failing on `gh release create`.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists — skipping."
            exit 0
          fi

          # Extract this version's section from the CHANGELOG: everything between
          # "## [VERSION]" and the next "## [" header.
          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md)

          # Trim leading/trailing blank lines (portable — no tac).
          NOTES=$(printf '%s\n' "$NOTES" \
            | sed '/./,$!d' \
            | awk 'NF{last=NR} {line[NR]=$0} END{for (i=1; i<=last; i++) print line[i]}')

          if [ -z "$NOTES" ]; then
            NOTES="Release $VERSION. See CHANGELOG.md for details."
          fi

          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release_notes.md"
          echo "----- release notes for $VERSION -----"
          cat "$RUNNER_TEMP/release_notes.md"

          # Only stable versions reach this job (see the job's `if:`), so the
          # release is always marked latest. --target creates the tag on the
          # merge commit that was just published.
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/release_notes.md" \
            --target "$TARGET_SHA" \
            --latest
