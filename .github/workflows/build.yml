name: Build

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*-rc[0-9]*'

permissions:
  id-token: write
  contents: read

# Single source of truth for tag validation, reused by the publish and release
# jobs so the gate stays identical. Restricted SemVer: MAJOR.MINOR.PATCH with an
# optional, well-formed prerelease (dot-separated [0-9A-Za-z-] identifiers,
# e.g. 2.4.0-rc1).
env:
  SEMVER_REGEX: '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'

jobs:
  # RC releases run the package and latest-SDK runtime checks. Stable releases
  # additionally run the complete compatibility build matrix.
  release-checks:
    name: ${{ contains(github.ref_name, '-rc') && 'RC checks' || 'Stable checks' }}
    uses: ./.github/workflows/integration-tests.yml
    with:
      run-compatibility-matrix: ${{ !contains(github.ref_name, '-rc') }}

  # Build and publish on version tags
  publish:
    runs-on: ubuntu-latest
    needs: [release-checks]
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # Node 24 bundles npm 11.x, which trusted publishing (OIDC) requires. Node 22
    # still bundles npm 10.9.x and cannot perform the OIDC exchange at all, so do
    # not lower this pin to match the other workflows.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'
        # No dependency cache on the release job. It saves only a few seconds on a
        # job that runs a handful of times a month, and this is the one job holding
        # npm publish rights. `package-manager-cache: false` also disables the
        # auto-detect fallback, which an explicit `cache` input would otherwise
        # take precedence over (actions/setup-node src/main.ts).
        package-manager-cache: false
    - name: Extract and validate version from tag
      id: get_version
      run: |
        set -euo pipefail
        VERSION="${GITHUB_REF#refs/tags/}"
        # Validate the tag is a simple SemVer before it flows into any script or
        # downstream job — guards against script injection via crafted tags.
        if ! printf '%s' "$VERSION" | grep -Eq "$SEMVER_REGEX"; then
          echo "::error::Tag '$VERSION' is not a valid SemVer version"
          exit 1
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Extracted version: $VERSION"
    - name: Update package.json version
      env:
        VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        set -euo pipefail
        npm version "$VERSION" --no-git-tag-version
        SWIFT_WRAPPER_FILE="ios/AppstackBridge.swift"
        # The Kotlin wrapper version lives in the shared implementation class, which both
        # the legacy and new architecture module classes delegate to.
        KOTLIN_WRAPPER_FILE="android/src/main/kotlin/com/appstack/reactnative/AppstackReactNativeModuleImpl.kt"
        sed -i "s/private static let wrapperVersion = \"react-native-[^\"]*\"/private static let wrapperVersion = \"react-native-$VERSION\"/" "$SWIFT_WRAPPER_FILE"
        sed -i "s/private const val WRAPPER_VERSION = \"react-native-[^\"]*\"/private const val WRAPPER_VERSION = \"react-native-$VERSION\"/" "$KOTLIN_WRAPPER_FILE"
        # Fail loudly if either substitution did not take effect. A silent no-op here
        # ships a stale wrapper version, which only the runtime smoke tests would catch.
        grep -q "wrapperVersion = \"react-native-$VERSION\"" "$SWIFT_WRAPPER_FILE" \
          || { echo "::error::Failed to stamp wrapper version in $SWIFT_WRAPPER_FILE"; exit 1; }
        grep -q "WRAPPER_VERSION = \"react-native-$VERSION\"" "$KOTLIN_WRAPPER_FILE" \
          || { echo "::error::Failed to stamp WRAPPER_VERSION in $KOTLIN_WRAPPER_FILE"; exit 1; }
        echo "✅ Updated package.json and WRAPPER_VERSION to $VERSION"

    - name: Build and test
      run: ./build.sh --ci --clean

    - name: Create npm package
      run: npm pack

    # Authenticates via npm trusted publishing (OIDC), backed by the workflow's
    # `id-token: write` permission and the trusted publisher configured on the
    # package. There is no NPM_TOKEN to rotate, expire, or have revoked. Provenance
    # attestations are generated automatically, so no --provenance flag is needed.
    - name: Publish to npm
      env:
        VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        set -euo pipefail
        # Trusted publishing needs npm >= 11.5.1. Fail loudly rather than silently
        # falling back to token auth, which no longer has a token to fall back to.
        REQUIRED_NPM="11.5.1"
        ACTUAL_NPM="$(npm --version)"
        if [[ "$(printf '%s\n%s\n' "$REQUIRED_NPM" "$ACTUAL_NPM" | sort -V | head -n1)" != "$REQUIRED_NPM" ]]; then
          echo "::error::npm $ACTUAL_NPM is too old for trusted publishing (need >= $REQUIRED_NPM)"
          exit 1
        fi
        # actions/setup-node writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
        # into its npmrc. With no token in the environment that expands to an empty
        # string, which npm reads as "auth is already configured" — it then skips the
        # OIDC exchange and publishes with empty credentials, failing with E404.
        NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
        if [[ -f "$NPMRC" ]]; then
          sed -i '/_authToken/d' "$NPMRC"
        fi
        if [[ "$VERSION" == *-* ]]; then
          npm publish --access public --tag rc
          echo "✅ Published $VERSION under the 'rc' dist-tag"
        else
          npm publish --access public
          echo "✅ Published $VERSION under the 'latest' dist-tag"
        fi

  # Create a GitHub Release so each version's changes are visible on the repo's
  # Releases page. Notes come from the matching CHANGELOG section. Runs only
  # after publish succeeds (needs: publish), and is the only job granted
  # contents: write.
  #
  # Skipped for pre-release tags (anything with a "-", e.g. 2.4.0-rc1): those
  # still publish to npm but do not get a GitHub Release.
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ !contains(needs.publish.outputs.version, '-') }}
    permissions:
      contents: write   # needed to create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Consume the version as an env value, not inline interpolation.
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail

          # Defense in depth: publish already validated this with the same
          # SEMVER_REGEX; re-check before it flows into git/gh commands.
          if ! printf '%s' "$VERSION" | grep -Eq "$SEMVER_REGEX"; then
            echo "::error::Refusing to release invalid version '$VERSION'"
            exit 1
          fi

          # Idempotent: skip if a release for this version already exists (e.g. a
          # workflow re-run) instead of failing on `gh release create`.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists — skipping."
            exit 0
          fi

          # Extract this version's section from the CHANGELOG: everything between
          # "## [VERSION]" and the next "## [" header.
          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md)

          # Trim leading/trailing blank lines (portable — no tac).
          NOTES=$(printf '%s\n' "$NOTES" \
            | sed '/./,$!d' \
            | awk 'NF{last=NR} {line[NR]=$0} END{for (i=1; i<=last; i++) print line[i]}')

          if [ -z "$NOTES" ]; then
            NOTES="Release $VERSION. See CHANGELOG.md for details."
          fi

          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release_notes.md"
          echo "----- release notes for $VERSION -----"
          cat "$RUNNER_TEMP/release_notes.md"

          # Only stable X.Y.Z tags reach this job (see the job's `if:`), so the
          # release is always marked latest.
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/release_notes.md" \
            --verify-tag \
            --latest
